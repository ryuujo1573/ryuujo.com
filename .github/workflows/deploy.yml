name: Build and Deploy to Aliyun ESA

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: esa-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Astro ISB (incremental static builds) reuses page output from the last
      # build. Restore the cacheDir BEFORE `astro build`; Astro itself
      # invalidates stale entries (module-graph hash + per-page cacheKey), so a
      # rolling restore-key that always grabs the newest cache is safe.
      - name: Restore Astro incremental build cache
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-isb-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            astro-isb-${{ runner.os }}-

      - name: Build
        run: bun run build

      # Login + deploy must share one step: esa-cli persists the session to
      # ~/.esa/config, and a deploy in a separate step would not see it if an
      # ALIBABA_CLOUD_* env group is present (it overrides saved credentials).
      # CUSTOM_ENDPOINT cuts each login-check to one API call; ESA's API
      # intermittently throttles with HTTP 417, so retry with backoff.
      - name: Login and deploy to ESA Pages
        env:
          CUSTOM_ENDPOINT: esa.cn-hangzhou.aliyuncs.com
        run: |
          set -e
          for attempt in 1 2 3 4; do
            if npx esa-cli login --skip-update-check \
                 --access-key-id "${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}" \
                 --access-key-secret "${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}" \
            && npx esa-cli deploy --skip-update-check \
                 -n ryuujo-com -e production -d "deploy ${GITHUB_SHA::7}"; then
              exit 0
            fi
            echo "::warning::ESA attempt $attempt failed (API can throttle with 417); retrying in 60s"
            sleep 60
          done
          exit 1

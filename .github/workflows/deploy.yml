name: Build and Deploy to Aliyun ESA

on:
  push:
    branches: [main]
  workflow_dispatch:
  # /cats bakes Home Assistant stats in at build time — rebuild periodically
  # so the page stays fresh.
  schedule:
    - cron: '23 */6 * * *'

concurrency:
  group: esa-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The /cats page fetches feeder stats from Home Assistant at build time
      # via the HA_TOKEN secret. If the fetch fails the page still builds, just
      # with a "data unavailable" notice.
      - name: Build
        env:
          HA_TOKEN: ${{ secrets.HA_TOKEN }}
        run: bun run build

      # esa-cli re-validates credentials via the ESA API on every invocation
      # (no bypass), and the free-tier API throttles aggressively with
      # HTTP 417. So: write ~/.esa/config directly (same file `esa-cli login`
      # saves, format per the CLI source), pin CUSTOM_ENDPOINT so each
      # invocation makes exactly ONE validation call, and retry with jitter.
      # Do NOT also export ALIBABA_CLOUD_*/ESA_* here: the env credential
      # group would override the saved config (harmless but pointless).
      - name: Deploy to ESA Pages
        env:
          AK_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          AK_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          CUSTOM_ENDPOINT: esa.cn-hangzhou.aliyuncs.com
        run: |
          set -e
          mkdir -p ~/.esa/config
          umask 077
          cat > ~/.esa/config/default.toml <<EOF
          endpoint = "esa.cn-hangzhou.aliyuncs.com"

          [auth]
          accessKeyId = "$AK_ID"
          accessKeySecret = "$AK_SECRET"
          EOF
          for attempt in 1 2 3 4 5 6; do
            if npx esa-cli deploy --skip-update-check \
                 -n ryuujo-com -e production -d "deploy ${GITHUB_SHA::7}"; then
              exit 0
            fi
            echo "::warning::ESA deploy attempt $attempt failed (upstream throttles with 417); retrying"
            sleep $((60 + RANDOM % 30))
          done
          exit 1
